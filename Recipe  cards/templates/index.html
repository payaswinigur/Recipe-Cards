    <div class="card">
        <img class="card__image" src="{{ recipe.image_url }}" alt="{{ recipe.name }}">

        <div class="card__body">
            <h1 class="card__title">{{ recipe.name }}</h1>

            <section>
                <h2 class="card__section-heading">Ingredients</h2>
                <ul class="card__ingredients">
                    {% for ingredient in recipe.ingredients %}
                        <li class="ingredient-row">
                            <span class="ingredient-qty">{{ ingredient.quantity }}</span>
                            <span class="ingredient-name">{{ ingredient.name }}</span>
                        </li>
                    {% endfor %}
                </ul>
            </section>

            <section>
                <h2 class="card__section-heading">Directions</h2>
                <ol class="card__directions">
                    {% for step in recipe.directions %}
                        <li>{{ step }}</li>
                    {% endfor %}
                </ol>
            </section>
        </div>
    </div>

</body>
</html>
